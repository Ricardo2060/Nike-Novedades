name: Nike news wall
on:
  schedule:
    - cron: "0 6,14,20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nike-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Generar muro (y correo si está configurado)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python monitor.py
      - name: Guardar historial
        run: |
          git config user.name  "nike-monitor"
          git config user.email "nike-monitor@users.noreply.github.com"
          git add seen.json items.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
      - name: Publicar página
        run: |
          cp -r out/site /tmp/site
          touch /tmp/site/.nojekyll
          git checkout --orphan gh-pages
          git rm -rf . > /dev/null
          git clean -fdx > /dev/null
          cp -r /tmp/site/. .
          git add -A
          git commit -m "publicar página"
          git push --force origin gh-pages
