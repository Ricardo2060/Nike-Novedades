# ─────────────────────────────────────────────────────────────
#  Fuentes oficiales de Nike — ordenadas por prioridad (1 = máxima)
#  Tipos: page (web sin RSS), youtube (canal por @handle), rss (feed ya existente)
#  Una fuente con `enabled: false` o con una URL "PEGA_..." se ignora.
# ─────────────────────────────────────────────────────────────
max_items_per_source: 10     # tope por fuente y por ejecución
# Personalización de la página
branding:
  title: "Novedades oficiales"
  store: "2060"           # aparece en la cabecera y en la pestaña del navegador
  accent: "#FA5400"              # color de acento (naranja Nike)
  logo_invert: false             # pon true si tu logo es negro y quieres verlo en blanco sobre la cabecera negra
  # El logo se sube al repositorio como logo.svg (o logo.png) y se detecta solo.

keep_days: 180               # cuánto tiempo recordar lo ya enviado
wall_days: 30               # el muro solo muestra lo publicado en los últimos 30 días
wall_items: 300              # tarjetas máximas en la página
include_shorts: false        # false = YouTube solo con vídeos normales, sin Shorts

sources:
  # ── 1. Webs oficiales ──────────────────────────────────────
  - name: Nike News (about.nike.com)
    type: page
    priority: 1
    platform: Newsroom
    url: https://about.nike.com/en/newsroom
    link_pattern: "/newsroom/(releases|news)/"
    render: true                 # la lista completa se carga con JavaScript: se abre con un navegador
    wait_for: "/newsroom/"       # espera a que aparezcan los enlaces de noticias
    max_age_days: 30             # solo noticias de hasta un mes
    max_items: 60                # tope de noticias nuevas por ejecución

  - name: Nike Magazine (about.nike.com)
    type: page
    platform: Magazine
    priority: 1
    url: https://about.nike.com/en/magazine
    link_pattern: '/magazine/[\w-]+/?$'
    render: true
    wait_for: "/magazine/"
    enrich: article              # abre cada artículo nuevo para leer su título, fecha e imagen reales
    enrich_limit: 40             # máximo de artículos que abre por ejecución
    max_age_days: 30
    max_items: 60

  - name: Nike.com · Stories
    type: page
    priority: 1
    url: https://www.nike.com/stories
    link_pattern: "/stories/"      # EXPERIMENTAL: nike.com suele bloquear scrapers

  # ── 2. YouTube oficial (se resuelve el canal por su @handle) ─
  - {name: "YouTube · Nike",            type: youtube, priority: 2, handle: nike}
  - {name: "YouTube · Nike Football",   type: youtube, priority: 2, handle: nikefootball}
  - {name: "YouTube · Nike Basketball", type: youtube, priority: 2, handle: nikebasketball}
  - {name: "YouTube · Nike Skateboarding", type: youtube, priority: 2, handle: nikeskateboarding}
  - {name: "YouTube · Nike Women",      type: youtube, priority: 2, handle: nikewomen}
  - {name: "YouTube · Nike Running",    type: youtube, priority: 2, handle: nikerunning}

  # ── 3. Instagram oficial ───────────────────────────────────
  # Instagram no ofrece RSS. Crea un feed por cuenta en un servicio como RSS.app
  # y pega aquí la URL del feed; pon enabled: true.
  - {name: "Instagram · @nike",           type: rss, platform: Instagram, priority: 3, enabled: false, url: PEGA_URL_RSS_AQUI}
  - {name: "Instagram · @nikebasketball", type: rss, platform: Instagram, priority: 3, enabled: false, url: PEGA_URL_RSS_AQUI}
  - {name: "Instagram · @nikewomen",      type: rss, platform: Instagram, priority: 3, enabled: false, url: PEGA_URL_RSS_AQUI}
  - {name: "Instagram · @nikesportswear", type: rss, platform: Instagram, priority: 3, enabled: false, url: PEGA_URL_RSS_AQUI}
  - {name: "Instagram · @niketraining",   type: rss, platform: Instagram, priority: 3, enabled: false, url: PEGA_URL_RSS_AQUI}
  - {name: "Instagram · @nikefootball",   type: rss, platform: Instagram, priority: 3, enabled: false, url: PEGA_URL_RSS_AQUI}

# Categorías: gana la primera que coincida (por palabras clave en título/resumen).
categories:
  - {name: Negocio,         keywords: [earnings, revenue, quarter, investor, fiscal, ceo, results, shareholder, resultados, ingresos]}
  - {name: Atletas,         keywords: [signs, signing, athlete, champion, medal, record, wins, nil roster, atleta, campeón, oro]}
  - {name: Colaboraciones,  keywords: [collab, collaboration, " x ", partnership, partner, colaboración, alianza]}
  - {name: Tecnología,      keywords: [technology, innovation, air zoom, flyknit, vaporfly, dri-fit, tech, engineered, tecnolog, innovaci]}
  - {name: Activaciones,    keywords: [event, pop-up, activation, house of, tour, experience, evento, experiencia]}
  - {name: Lanzamientos,    keywords: [launch, drop, release, available, debut, introduc, unveil, reveal, lanzamiento, disponible]}
  - {name: Producto,        keywords: [collection, shoe, sneaker, kit, jersey, footwear, apparel, colección, zapatilla]}
